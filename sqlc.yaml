version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db/gen
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        # Nullable columns become pointers via emit_pointers_for_null_types, so
        # only the non-null mapping is overridden here. Declaring the nullable
        # case as *time.Time as well yields **time.Time.
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
