<!--
  The mark knocked out of a black tile, square, for the browser tab.

  Square because logo.svg's shape is nearly three times wider than it is tall,
  and a tab renders that at a height nothing can read. Same geometry, centred,
  reversed out. Keep the two in step if either changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 316"
     role="img" aria-label="Beal House">
  <rect width="316" height="316" fill="#0a0a0a" />
  <g fill="#ffffff" transform="translate(0 101)">
    <rect x="30" y="16" width="6" height="42" />
    <rect x="64" y="16" width="6" height="42" />
    <path d="M6 56 54 24 102 56Z" />
    <rect x="20" y="56" width="68" height="44" />

    <rect x="134" y="22" width="6" height="46" />
    <path d="M106 66 162 40 218 66Z" />
    <rect x="118" y="66" width="88" height="34" />

    <circle cx="266" cy="22" r="8" />
    <path d="M222 58 266 30 310 58Z" />
    <rect x="234" y="58" width="64" height="42" />
  </g>
</svg>
