<!--
  The Beal House mark: the three connected buildings, in ink on nothing.

  Geometry rather than a traced bitmap, so it stays sharp at a favicon's size and
  on a letterhead, and so a colour change is an edit rather than a re-export.
  favicon.svg is the same shape knocked out of a black tile; logo-email.png is
  this rasterised, because mail clients do not render SVG.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 108"
     role="img" aria-label="Beal House">
  <g fill="#1c1917">
    <!-- The tall house, two chimneys. -->
    <rect x="30" y="16" width="6" height="42" />
    <rect x="64" y="16" width="6" height="42" />
    <path d="M6 56 54 24 102 56Z" />
    <rect x="20" y="56" width="68" height="44" />

    <!-- The long low range between them. -->
    <rect x="134" y="22" width="6" height="46" />
    <path d="M106 66 162 40 218 66Z" />
    <rect x="118" y="66" width="88" height="34" />

    <!-- The house with the cupola. -->
    <circle cx="266" cy="22" r="8" />
    <path d="M222 58 266 30 310 58Z" />
    <rect x="234" y="58" width="64" height="42" />
  </g>
</svg>
